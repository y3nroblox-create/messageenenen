<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мессенджер</title>
<style>
  :root {
    --bg: #eef1f5;
    --panel: #ffffff;
    --text: #1d2430;
    --muted: #7b8594;
    --mine: #2b6cdf;
    --mine-text: #ffffff;
    --theirs: #ffffff;
    --line: #d9dee6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c;
      --panel: #1a2029;
      --text: #e8ecf2;
      --muted: #8a94a3;
      --theirs: #232b36;
      --line: #2c3541;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    font-weight: 600;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .msg {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: 16px;
    background: var(--theirs);
    align-self: flex-start;
    overflow-wrap: anywhere;
  }
  .msg.mine {
    background: var(--mine);
    color: var(--mine-text);
    align-self: flex-end;
  }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .msg.mine .meta { color: rgba(255, 255, 255, 0.75); }
  form {
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--panel);
    border-top: 1px solid var(--line);
  }
  input {
    flex: 1;
  function addMessage(m) {
    const el = document.createElement("div");
    el.className = "msg" + (m.name === name ? " mine" : "");
    const meta = document.createElement("div");
    meta.className = "meta";
    const t = new Date(m.time).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    meta.textContent = m.name + ", " + t;
    const text = document.createElement("div");
    text.textContent = m.text; // textContent защищает от вставки чужого HTML
    el.append(meta, text);
    box.append(el);
    box.scrollTop = box.scrollHeight;
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(proto + "//" + location.host);
    ws.onopen = () => ws.send(JSON.stringify({ type: "join", name }));
    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === "history") {
        box.textContent = "";
        data.messages.forEach(addMessage);
      } else if (data.type === "msg") {
        addMessage(data.message);
      }
    };
    ws.onclose = () => setTimeout(connect, 2000);
  }
  connect();

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type: "msg", text }));
    input.value = "";
  });
</script>
</body>
              </html>
